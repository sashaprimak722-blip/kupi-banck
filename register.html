<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — KUPI Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <h1>📝 Регистрация</h1>
        <p class="auth-subtitle">Создай свой кошелёк KUPI Bank</p>

        <form id="registerForm" class="auth-form">
            <div class="input-group">
                <label for="regNick">Никнейм:</label>
                <input type="text" id="regNick" placeholder="Например, Satoshi" required>
            </div>

            <div class="input-group">
                <label for="regEmail">Email:</label>
                <input type="email" id="regEmail" placeholder="you@example.com" required>
            </div>

            <div class="input-group">
                <label for="regPassword">Пароль:</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="Минимум 6 символов" required minlength="6">
                    <button type="button" id="togglePassword" class="eye-btn">👁️</button>
                </div>
            </div>

            <div class="input-group">
                <label for="regSecret">Защитное слово:</label>
                <input type="text" id="regSecret" placeholder="Например, имя питомца" required>
            </div>

            <div class="input-group">
                <label for="regPromo">Промокод (если есть):</label>
                <input type="text" id="regPromo" placeholder="Введите промокод">
            </div>

            <button type="submit" class="btn btn-start">Зарегистрироваться</button>
        </form>

        <p class="auth-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        <a href="index.html" class="btn btn-back">← Назад в меню</a>
    </div>

    <script src="auth.js"></script>
</body>
</html>

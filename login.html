<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — KUPI Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <h1>🔑 Вход</h1>
        <p class="auth-subtitle">Введи свои данные, чтобы продолжить.</p>

        <form id="loginForm" class="auth-form">
            <div class="input-group">
                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required>
            </div>

            <div class="input-group">
                <label for="loginPassword">Пароль:</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Твой пароль" required>
                    <button type="button" id="toggleLoginPassword" class="eye-btn">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn btn-start">Войти</button>
        </form>

        <p class="auth-link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
        <a href="index.html" class="btn btn-back">← Назад в меню</a>
    </div>

    <script src="auth.js"></script>
</body>
</html>
